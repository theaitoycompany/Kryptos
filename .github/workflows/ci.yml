name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.8.22
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --locked ruff check src tests benchmarks scripts
      - run: uv run --locked ruff format --check src tests benchmarks scripts
      - run: uv run --locked python -m unittest discover -s tests -q
      - run: uv run --locked kryptos selftest
      - run: uv run --locked python scripts/check_release.py
      - run: uv run --locked python -m build
        env:
          SOURCE_DATE_EPOCH: '1767225600'
      - run: uv run --locked python scripts/check_distribution.py
      - run: uv run --locked python -m benchmarks.run --profile core --output .build/core.json

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium
      - run: npm test
