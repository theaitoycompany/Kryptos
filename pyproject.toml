[build-system]
requires = ["setuptools==82.0.0", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "kryptos-pii"
version = "0.1.1"
description = "Local transcript de-identification with role-aware pseudonyms and explicit review gates"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "The AI Toy Company"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Repository = "https://github.com/theaitoycompany/Kryptos"
Issues = "https://github.com/theaitoycompany/Kryptos/issues"
Demo = "https://huggingface.co/spaces/the-ai-toy-company/Kryptos"

[project.optional-dependencies]
ml = ["gliner==0.2.24", "transformers==5.16.1", "torch==2.14.0"]
fast = ["rapidfuzz==3.14.6"]
benchmark = ["pyarrow==25.0.1"]

[project.scripts]
kryptos = "kryptos.cli:main"

[dependency-groups]
dev = ["build==1.6.1", "ruff==0.16.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kryptos = ["resources/*.json", "resources/*.txt"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
